name: Automated News Fetcher

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-bot-group
  cancel-in-progress: false

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run News Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python bot.py

      - name: Commit and push changes
        run: |
          git config --global user.name "Global Terminal Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add public/news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Live terminal feed update" && git pull --rebase origin main && git push)
