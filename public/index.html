    @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .ticker-move { display: flex; width: max-content; animation: ticker 38s linear infinite; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes pulse-border {

      50% { border-color: rgba(244, 63, 94, 0.2); box-shadow: 0 0 4px rgba(244, 63, 94, 0.05); }
    }
    .urgent-flash { animation: pulse-border 2s infinite; }
  </style>
